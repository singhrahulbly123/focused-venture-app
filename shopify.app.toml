# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a51145b95e41dfa97a73eab06b4bb034"
name = "focused-venture-app"
application_url = "https://focused-venture-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_app_proxy"

[auth]
redirect_urls = [ "https://focused-venture-app.onrender.com/auth/callback" ]

[app_proxy]
url = "/apps/draft-preview"
subpath = "draft-preview"
prefix = "apps"
